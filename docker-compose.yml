# Ambiente local completo: `docker compose up --build`
# Postgres corre con autenticación "trust" y Redis sin contraseña, así no hay ninguna
# credencial en el repo. Los puertos solo escuchan en 127.0.0.1.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: arenal
      POSTGRES_USER: arenal
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U arenal -d arenal']
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20

  server:
    build: .
    environment:
      PG_HOST: postgres
      REDIS_HOST: redis
      LOG_LEVEL: info
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
