# Archivo generado por `pnpm contracts:generate` a partir de los esquemas Zod. No editar a mano.
asyncapi: 3.0.0
info:
  title: Arenal — protocolo en tiempo real
  version: 0.1.0
  description: |-
    Protocolo WebSocket del servidor de Arenal, versión 1.

    La conexión se autentica en el handshake con un ticket de un solo uso que dura 30 segundos
    (se pide con `POST /v1/realtime/tickets`). Sin ticket válido el servidor responde 401 y no abre el socket.
    Cada mensaje del cliente pesa como máximo 4096 bytes y se valida contra su esquema.
    El servidor manda ping cada 15 segundos; si no recibe pong en 30, cierra con 4000.

    **Códigos de cierre**

    - **1000**: Cierre normal: el jugador salió de la partida.
    - **1008**: Origen no permitido o violación de política.
    - **1009**: Mensaje más grande que 4096 bytes.
    - **1012**: La réplica se está reiniciando: reconectar y mandar resume.
    - **4000**: No respondió al heartbeat a tiempo.
    - **4003**: Cuenta suspendida o sin permiso para esta partida.
    - **4029**: Demasiadas conexiones o demasiados mensajes.

    **Códigos de error**: `NOT_A_PLAYER`, `PLAYER_ELIMINATED`, `NOT_YOUR_TURN`, `CARD_NOT_IN_HAND`, `MATCH_NOT_STARTED`, `MATCH_FINISHED`, `INVALID_MESSAGE`, `UNSUPPORTED_VERSION`, `STALE_STATE`, `MATCH_NOT_FOUND`, `RATE_LIMITED`, `INTERNAL`
servers:
  local:
    host: localhost:8080
    protocol: ws
    pathname: /v1/realtime
    description: docker compose up
    security:
      - $ref: "#/components/securitySchemes/ticket"
  azure:
    host: "{appFqdn}"
    protocol: wss
    pathname: /v1/realtime
    description: Azure Container Apps
    variables:
      appFqdn:
        description: Dominio de la app en Azure Container Apps
    security:
      - $ref: "#/components/securitySchemes/ticket"
channels:
  realtime:
    address: /v1/realtime
    title: Conexión en tiempo real
    messages:
      PlayCard:
        $ref: "#/components/messages/PlayCard"
      Resume:
        $ref: "#/components/messages/Resume"
      LeaveMatch:
        $ref: "#/components/messages/LeaveMatch"
      Ack:
