                  minimum: -9007199254740991
                  maximum: 9007199254740991
                limitMin:
                  type: integer
                  minimum: -9007199254740991
                  maximum: 9007199254740991
                limitMax:
                  type: integer
                  minimum: -9007199254740991
                  maximum: 9007199254740991
                coolAmount:
                  type: integer
                  minimum: -9007199254740991
                  maximum: 9007199254740991
                seismoThreshold:
                  type: integer
                  minimum: -9007199254740991
                  maximum: 9007199254740991
                maxRounds:
                  type: integer
                  minimum: -9007199254740991
                  maximum: 9007199254740991
              required:
                - startingLives
                - handSize
                - limitMin
                - limitMax
                - coolAmount
                - seismoThreshold
                - maxRounds
            result:
              anyOf:
                - oneOf:
                    - type: object
                      properties:
                        kind:
                          type: string
                          const: winner
                        winner:
                          type: string
                          minLength: 1
                          maxLength: 64
                        reason:
                          type: string
                          enum:
                            - last_standing
                            - most_lives
                      required:
                        - kind
                        - winner
                        - reason
                    - type: object
                      properties:
                        kind:
                          type: string
                          const: draw
                        players:
                          type: array
                          items:
                            type: string
                            minLength: 1
                            maxLength: 64
                        reason:
                          type: string
                          enum:
                            - tied_lives
                            - no_players
                      required:
                        - kind
                        - players
                        - reason
                - type: "null"
          required:
            - matchId
            - status
            - version
            - round
            - turn
            - currentPlayer
            - pressure
            - lastRevealedLimit
            - drawPileCount
            - discardCount
            - players
            - you
            - rules
            - result
          description: Lo que un jugador puede ver de la partida. Nunca incluye el límite secreto ni el mazo.
      required:
        - v
        - type
        - matchId
        - seq
        - view
      description: Estado completo visible para el jugador. Se manda al conectarse o al reconectar.
    Error:
      type: object
      properties:
        v:
          type: number
          const: 1
        type:
          type: string
          const: error
        id:
          anyOf:
            - type: string
              format: uuid
              pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
              description: ID generado por el cliente. Si reenvía el mismo ID, la jugada no se aplica dos veces.
            - type: "null"
          description: ID del mensaje que causó el error, si se pudo leer.
        code:
          type: string
          enum:
            - NOT_A_PLAYER
            - PLAYER_ELIMINATED
            - NOT_YOUR_TURN
            - CARD_NOT_IN_HAND
            - MATCH_NOT_STARTED
            - MATCH_FINISHED
            - INVALID_MESSAGE
            - UNSUPPORTED_VERSION
            - STALE_STATE
            - MATCH_NOT_FOUND
            - RATE_LIMITED
            - INTERNAL
        message:
          type: string
        retryable:
          type: boolean
      required:
        - v
        - type
        - id
        - code
        - message
        - retryable
      description: Error tipado. Un mensaje inválido nunca cierra la partida.
