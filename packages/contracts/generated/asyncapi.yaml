operations:
  playCard:
    action: receive
    channel:
      $ref: "#/channels/realtime"
    summary: El jugador de turno juega una carta.
    messages:
      - $ref: "#/channels/realtime/messages/PlayCard"
    reply:
      channel:
        $ref: "#/channels/realtime"
      messages:
        - $ref: "#/channels/realtime/messages/Ack"
        - $ref: "#/channels/realtime/messages/Error"
  resume:
    action: receive
    channel:
      $ref: "#/channels/realtime"
    summary: El cliente pide los eventos que le faltan.
    messages:
      - $ref: "#/channels/realtime/messages/Resume"
    reply:
      channel:
        $ref: "#/channels/realtime"
      messages:
        - $ref: "#/channels/realtime/messages/Snapshot"
        - $ref: "#/channels/realtime/messages/Error"
  leaveMatch:
    action: receive
    channel:
      $ref: "#/channels/realtime"
    summary: El jugador abandona la partida.
    messages:
      - $ref: "#/channels/realtime/messages/LeaveMatch"
    reply:
      channel:
        $ref: "#/channels/realtime"
      messages:
        - $ref: "#/channels/realtime/messages/Ack"
        - $ref: "#/channels/realtime/messages/Error"
  sendEvent:
    action: send
    channel:
      $ref: "#/channels/realtime"
    summary: El servidor reparte cada evento confirmado, filtrado para cada jugador.
    messages:
      - $ref: "#/channels/realtime/messages/Event"
  sendSnapshot:
