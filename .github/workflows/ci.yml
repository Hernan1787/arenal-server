name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, tipos, pruebas y contratos
    runs-on: ubuntu-latest
    services:
      # Misma configuración que docker compose: sin contraseña, solo accesible desde el runner.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: arenal
          POSTGRES_USER: arenal
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arenal -d arenal"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
    env:
      PG_HOST: 127.0.0.1
      REDIS_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Formato (Prettier)
        run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Pruebas unitarias
        run: pnpm test
      - name: Pruebas de integración (Postgres, Redis y WebSocket)
        run: pnpm test:integration
      - name: Contratos sincronizados con el código
        run: pnpm contracts:check
      - name: Validar AsyncAPI con la CLI oficial
        run: |
          npx --yes @asyncapi/cli@6.2.2 config analytics --disable || true
          npx --yes @asyncapi/cli@6.2.2 validate packages/contracts/generated/asyncapi.yaml

  infra:
    name: Infraestructura (Bicep, scripts y workflows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Bicep compila sin advertencias
        run: |
          az bicep install
          az bicep build --file infra/main.bicep --stdout > /dev/null 2> bicep.log || { cat bicep.log; exit 1; }
          # Diagnósticos de Bicep: "archivo(línea,col) : Warning regla: …"
          if grep -E '\) : (Warning|Error) ' bicep.log; then exit 1; fi
      - name: Parámetros de dev y prod
        env:
          DEPLOYER_PRINCIPAL_ID: 00000000-0000-0000-0000-000000000000
          ALERT_EMAIL: ci@ejemplo.com
        run: |
          for env in dev prod; do az bicep build-params --file "infra/$env.bicepparam" --stdout > /dev/null; done
      - name: Scripts de despliegue (shellcheck)
        run: shellcheck -x infra/scripts/*.sh

  secrets:
    name: Búsqueda de secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    name: Imagen y escaneo (Trivy)
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: arenal
          POSTGRES_USER: arenal
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arenal -d arenal"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: arenal-server:ci
          build-args: APP_VERSION=${{ github.sha }}
      - name: La imagen no corre como root
        run: |
          uid="$(docker run --rm --entrypoint id arenal-server:ci -u)"
          echo "UID dentro del contenedor: $uid"
          test "$uid" != "0"
      - name: La imagen arranca, migra la base y queda lista
        run: |
          # La imagen corre en modo producción y exige la llave de firma de los JWT. En Azure viene
          # de Key Vault; aquí se genera una desechable en cada corrida.
          JWT_PRIVATE_KEY="$(openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256)"
          export JWT_PRIVATE_KEY
          docker run -d --name smoke --network host -e PG_HOST=127.0.0.1 -e REDIS_HOST=127.0.0.1 -e JWT_PRIVATE_KEY arenal-server:ci
          for _ in $(seq 1 30); do curl -fsS localhost:8080/health/ready && break; sleep 1; done
          curl -fsS localhost:8080/health/ready || { docker logs smoke; exit 1; }
      - name: Prueba de humo de la API (registro con Argon2 nativo dentro del contenedor)
        run: |
          # La contraseña se genera en cada corrida: ninguna queda escrita en el repo.
          clave="$(openssl rand -hex 16)"
          code=$(curl -s -o /tmp/registro.json -w '%{http_code}' -X POST localhost:8080/v1/auth/register \
            -H 'content-type: application/json' \
            -d "{\"email\":\"humo@ejemplo.com\",\"password\":\"$clave\",\"displayName\":\"Humo\"}")
          echo "POST /v1/auth/register -> $code"
          test "$code" = "201" || { cat /tmp/registro.json; docker logs smoke; exit 1; }
          curl -fsS -o /dev/null localhost:8080/docs/json
      - name: Sin vulnerabilidades críticas
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: arenal-server:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
