name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, tipos, pruebas y contratos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Contratos sincronizados con el código
        run: pnpm contracts:check
      - name: Validar AsyncAPI con la CLI oficial
        run: |
          npx --yes @asyncapi/cli@6.2.2 config analytics --disable || true
          npx --yes @asyncapi/cli@6.2.2 validate packages/contracts/generated/asyncapi.yaml

  secrets:
    name: Búsqueda de secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    name: Imagen y escaneo (Trivy)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: arenal-server:ci
          build-args: APP_VERSION=${{ github.sha }}
      - name: La imagen no corre como root
        run: |
          uid="$(docker run --rm --entrypoint id arenal-server:ci -u)"
          echo "UID dentro del contenedor: $uid"
          test "$uid" != "0"
      - name: La imagen arranca y responde /health/live
        run: |
          docker run -d --name smoke -p 8080:8080 arenal-server:ci
          for i in $(seq 1 20); do curl -fsS localhost:8080/health/live && exit 0; sleep 1; done
          docker logs smoke; exit 1
      - name: Sin vulnerabilidades críticas
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: arenal-server:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
