name: Rollback

# Vuelve a poner la imagen anterior al último despliegue (sigue en el registro). Tarda un par de
# minutos y no corta partidas; el procedimiento manual está en docs/deploy.md.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente
        type: choice
        options: [prod, dev]
        default: prod
      image:
        description: 'Etiqueta de la imagen (vacío: la anterior al último despliegue)'
        required: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  rollback:
    name: Rollback de ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Imagen anterior y prueba de humo
        env:
          ENV_NAME: ${{ inputs.environment }}
          TARGET: ${{ inputs.image }}
        run: infra/scripts/rollback.sh "$ENV_NAME" "$TARGET"
