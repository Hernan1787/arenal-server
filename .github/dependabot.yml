version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # Los tipos de Node siguen la versión del runtime (Node 24); se suben a mano junto con él.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # La imagen se queda en Node 24 LTS. Las versiones impares (25, 27…) tienen soporte corto
      # y el cambio de versión mayor se decide a mano, junto con .nvmrc y el CI.
      - dependency-name: 'node'
        update-types: ['version-update:semver-major']
